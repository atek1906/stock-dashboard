services:
  web:
    # Use the prebuilt registry image in production; build locally as a fallback.
    image: ghcr.io/YOUR_ORG/monitoring-dashboard:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/metrics/system"]
      interval: 30s
      timeout: 10s
      retries: 3
